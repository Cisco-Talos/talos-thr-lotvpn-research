Detection:
- Type: Endpoint
  Description: >-
    Identify ExpressVPN-attributed installation, first launch, activation, and
    uninstall relationships. Generic installers and Windows utilities require a
    product path, product-specific driver or service argument, or direct
    ExpressVPN process ancestry.
  Indicators:
  - >-
    The WiX Burn bootstrapper starts ExpressVPN prerequisite and MSI chains; installation yields three
    running automatic ExpressVPN services
  - >-
    Product driver installers create the ExpressVPN TAP, TUN, DCO, packet-filter, and split-tunnel components
    using product-specific names and paths
  - >-
    Manual first launch starts ExpressVPN.exe and ExpressVPNNotificationService.exe, which connect to
    ExpressVPN App Service over loopback IPC
  - >-
    During an unsuccessful activation attempt, ExpressVPN.exe exchanges loopback IPC while App Service performs
    DNS and one external HTTPS connection; activation is rejected and no tunnel state appears
  - Normal uninstall runs the cached bundle, updater, CLI disconnect, and product driver-removal chain
- Type: Forensic
  Description: >-
    Use durable registrations, product state, and residual packages instead of
    hashes, shortcuts, signatures duplicated from dedicated fields, or
    host-assigned package names.
  Indicators:
  - >-
    The three automatic services, ExpressVPN Run value, URL protocol, native-messaging hosts, and two
    uninstall registrations establish installed state
  - First launch creates versioned per-user configuration and notification registration
  - >-
    The unsuccessful activation updates RecentLocations, Parameters.json, binary configuration state, and
    per-user configuration; sensitive configuration contents are excluded from the profile
  - >-
    Normal uninstall removes product registrations, services, driver services, adapters, application state,
    and shortcuts
  - >-
    ExpressVPN driver binaries and DriverStore packages, the per-user toast icon, and temporary install/uninstall
    logs remain after uninstall
- Type: Network
  Description: >-
    Focus on ExpressVPN service relationships and network-stack transitions.
    Generic prerequisite, certificate-validation, telemetry-platform, Windows
    connectivity-check, resolver, and numeric endpoint observations are
    intentionally excluded.
  Indicators:
  - Installation creates three disconnected ExpressVPN virtual adapters and an NDIS packet filter
  - ExpressVPN App Service uses loopback IPC with the GUI, notification process, System Service, and VPN Service
  - >-
    During the unsuccessful activation attempt, App Service performs DNS and one external HTTPS connection while
    the GUI process exchanges only loopback traffic
  - No successful activation or VPN tunnel is observed
  - Uninstall removes the three adapters and their local routes and DNS state without changing firewall rules
