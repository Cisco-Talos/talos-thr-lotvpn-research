      Args:
        - >-
          itop-vpn.exe /sp- /verysilent /norestart /Installer /silenthide
          /insthandle=<handle> /DIR="C:\Program Files (x86)\iTop VPN"
          /quicklaunchicon
        - >-
          ugin.exe /init /ver 7.4.0.6857 /force /f /inspkg
          "C:\vpn-installers\itop-vpn.exe" /PINTOTASKBAR
          /insthandle <handle>
        - ugin.exe /checkwelcome
        - ugin.exe /setlan "English"
        - unpr.exe /install itop7
        - iTopVPN.exe /installinit
        - iTopVPN.exe /install
        - iTopVPN.exe /autostart
        - iTopVPN.exe /SkipUac
        - iTopVPNMini.exe /antrun /install /state 0
        - atud.exe /auto
        - aud.exe /itop /dayactive
        - aud.exe /itop /dayuser
        - wstr.exe
        - ugin.exe /sockstchk
        - ugin.exe /postbnst /self
        - ScanGameInfo.exe /ScanGame
        - icop64.exe Pin "C:\Program Files (x86)\iTop VPN\iTopVPN.exe"
        - cmd.exe /c ipconfig /flushdns
        - cmd.exe /c netsh interface ipv4 set interface "<interface>" mtu=1500
        - cmd.exe /c sc stop windivert
        - cmd.exe /c sc delete windivert
        - cmd.exe /c sc stop itvwd
        - cmd.exe /c sc delete itvwd
        - sc.exe start MpsSvc
        - unins000.exe
        - >-
          _unins.tmp /SECONDPHASE="C:\Program Files (x86)\iTop VPN\unins000.exe"
          /FIRSTPHASEWND=<handle>
        - >-
          ugin.exe /uginUn "C:\Program Files (x86)\iTop VPN\unins000.exe"
        - unins000.exe /SILENT /uginUn /un /unsOpt 1
        - ugin.exe /setdir "%LOCALAPPDATA%\Temp\is-*.tmp"
        - iTopVPN.exe /uninstall_schedule
        - ugin.exe /kill /UNINSTALL
        - >-
          unpr.exe /UNINSTALL itop7
          "C:\Program Files (x86)\iTop VPN\unins000.exe" /Silent
        - ugin.exe /UninstallClean
        - icop64.exe UnPin "C:\Program Files (x86)\iTop VPN\iTopVPN.exe"
    - Platform: macOS
      Args: []
  CodeSigning:
    - Platform: Windows installer
      Publisher: Not signed
    - Platform: Windows installed binaries
