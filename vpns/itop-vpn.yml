    - HKLM\SOFTWARE\WOW6432Node\Microsoft\Edge\NativeMessagingHosts\com.itop.itopvpnnative
    - HKLM\SOFTWARE\WOW6432Node\Mozilla\NativeMessagingHosts\com.itop.itopvpnnative
    - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\iTopVPN_Scheduler_<user>
    - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\iTopVPN_Update_<user>
    - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\iTopVPN_SkipUAC_<user>
