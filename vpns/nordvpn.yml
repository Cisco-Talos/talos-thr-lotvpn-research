    - '%LOCALAPPDATA%\NordVPN\*\ovpn_tcp\*.ovpn'
    - '%PROGRAMDATA%\NordVPN\FeatureConfigs\*.json'
    - '%PROGRAMDATA%\NordVPN\settings.db*'
    - '%PROGRAMDATA%\NordVPN\settings\connection.db*'
    - '%PROGRAMDATA%\NordVPN\connections\vpn_state_heartbeat.db'
    - '%PROGRAMDATA%\NordVPN\Analytics\NordVPN.db*'
    - '%PROGRAMDATA%\NordVPN\remote.json'
    - '%PROGRAMDATA%\NordVPN\periodic-task-times.json'
    - '%PROGRAMDATA%\NordVPN\configs\templates\*.xslt'
    - '%PROGRAMDATA%\NordVPN\settings\*.json*'
    - '%PROGRAMDATA%\NordVPN\ThreatProtection\Settings\settings.db*'
    - '%LOCALAPPDATA%\NordVPN\settings.db*'
    - '%LOCALAPPDATA%\NordVPN\pdp_cache.db*'
    - '%LOCALAPPDATA%\NordVPN\servers_v2.json'
    - '%LOCALAPPDATA%\NordVPN\mercatorClustersConfiguration.json'
    - '%LOCALAPPDATA%\NordVPN\FeatureConfigs\*.json'
    - '%LOCALAPPDATA%\NordVPN\inappnotifications*'
    - '%LOCALAPPDATA%\NordVPN\notifications*'
    - '%LOCALAPPDATA%\NordVPN\ProfileOptimization\Startup-*.profile'
    - '%LOCALAPPDATA%\ToastNotificationManagerCompat\Apps\NordVPN\Icon.png'
