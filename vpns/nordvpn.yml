    - ovpn-dco
    Drivers:
    - NDivert.sys
    - wireguard.sys
    - tapnordvpn.sys
    - ovpn-dco.sys
    Attribution: >-
      Require a NordVPN installation path, service registration, product-specific
      argument, signature, or direct NordVPN process ancestry; these shared
      utilities and VPN drivers are not standalone NordVPN identifiers.
  ApplicationInfo:
  - Platform: Windows
    AppName: NordVPN
    ExecutableName: NordVPN.exe
    Version: 8.7.2.0
    Publisher: Nord Security
    InstallLocation: C:\Program Files\NordVPN
    AdditionalComponents:
    - NordUpdater 1.5.0.1028
    - Microsoft Windows Desktop Runtime 8.0.23 (x64)
    - NordSec Threat Protection service
    - NDivert packet-filter driver
    - NordLynx WireGuard adapter
    - TAP-NordVPN adapter
    - OpenVPN Data Channel Offload adapter
  InstallationPaths:
