    - /var/root/Library/Caches/com.crashlytics.data/com.nordvpn.macos.helper/
  CommandLineArgs:
  - Platform: Windows
    Args:
    - cmd.exe /c dotnet --list-runtimes
    - <temporary-dotnet-installer>.exe /install /quiet /norestart
    - <temporary-nordvpn-installer>.exe /SILENT /VERYSILENT /NORESTART
    - >-
      NordUpdaterSetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NOCANCEL /NORESTART
      /RESTARTEXITCODE=3010 /NOCLOSEAPPLICATIONS
    - pnputil.exe /add-driver "<NordVPN path>\Drivers\Win11\ovpn-dco.inf" /install
    - pnputil.exe /add-driver "<NordVPN path>\Drivers\OemVista.inf" /install
    - tapctl.exe list --hwid tapnordvpn
    - tapctl.exe list --hwid ovpn-dco
    - tapctl.exe create --hwid tapnordvpn
    - tapctl.exe create --name "OpenVPN Data Channel Offload for NordVPN" --hwid ovpn-dco
    - netsh interface ip set address name="<NordLynx interface>" source=static address=<tunnel-address> mask=<tunnel-mask>
    - '"nordvpn://login/?action=login&exchange_token=<redacted>&status=done"'
    - >-
      msedge.exe --single-argument
      https://napps-1.com/v1/users/oauth/login-redirect?attempt=<redacted>
    - '"C:\Program Files\NordVPN\unins000.exe" /LOG'
    - >-
      "C:\Program Files\NordUpdater\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES
      /NORESTART /RESTARTEXITCODE=3010
    - taskkill.exe /f /im NordVPN.exe
    - >-
      netcfg.exe -u NordLwf
    - >-
      pnputil.exe /uninstall /force -d <TAP-NordVPN OEM INF>
    - >-
      route.exe DELETE <default-route> MASK <default-route-mask> <product gateway> if
      <NordLynx interface index>
    - >-
      netsh.exe interface <ipv4-or-ipv6> set dnsservers name=<NordLynx interface index>
      source=static address=none validate=no register=both
    - sc.exe <stop-or-delete> NDivert
    - cmdkey.exe /delete:NordVPN/<credential-target>
    - schtasks.exe /delete /tn "NordVPN scheduled start" /f
    - --auto-start
    - --config "<path>" --mute-replay-warnings --hand-window <num> --management-hold --management-query-passwords --suppress-timestamps --management <version> <num> stdin --register-dns --script-security <num> --service <file>
    - --config "<path>" --mute-replay-warnings --hand-window <num> --management-hold --management-query-passwords --suppress-timestamps --management <version> <num> stdin --register-dns --script-security <num> --service <file> <num>
    - --version <version>
