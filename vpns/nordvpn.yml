Name: Nordvpn
VendorInfo:
  Company: Nordvpn S.A.
  Website: https://nordvpn.com/
  Jurisdiction: Panama
  BusinessModel: Paid
ForensicAttributes:
  ProcessNames:
  - Platform: Windows
    Name:
    - NordVPN.exe
    - NordUpdateService.exe
    - nordvpn-service.exe
    - nordsec-threatprotection-service.exe
    - openvpn-nordvpn.exe
