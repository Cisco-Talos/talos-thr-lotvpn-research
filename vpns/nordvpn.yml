    Path:
    - C:\Program Files\NordVPN\
    - C:\Program Files\NordUpdater\
    - '%PROGRAMDATA%\NordVPN\'
    - '%PROGRAMDATA%\NordUpdater\'
    - '%LOCALAPPDATA%\NordVPN\'
