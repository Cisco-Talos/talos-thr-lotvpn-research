NetworkBehavior:
  Protocols:
  - WireGuard (observed during a successful Windows connection)
  - OpenVPN
  - IKEv2
  - HTTPS (Windows installation, update, automatic-client-launch, authenticated-login,
    and connection control-plane traffic)
  - DNS (Windows installation, automatic-client-launch, authenticated-login, and
    tunneled connection traffic)
  - NTP (automatic-client-launch time check)
  Ports:
  - UDP 51820 (WireGuard)
  - UDP 1194 (OpenVPN)
  - TCP 443 (OpenVPN; also observed for Windows installation, update, startup, and
    authenticated-login HTTPS without a VPN tunnel)
  - UDP 53 (Windows installation, automatic-client-launch, and authenticated-login
    DNS)
  - UDP 123 (automatic-client-launch NTP)
  TunnelInterfaces:
  - ProtonVPN (Windows WireGuard Tunnel)
  - utun0, utun1, utun2, utun3 (macOS)
  TLSFingerprint: []
  EncryptionStandards:
