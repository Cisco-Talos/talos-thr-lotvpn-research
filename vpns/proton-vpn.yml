    Name:
    - ProtonVPN
    - ch.protonvpn.mac.WireGuard-Extension
  ServiceNames:
  - Platform: Windows
    Name:
    - ProtonVPN Service
    - ProtonVPN WireGuard
    - ProtonVPNCallout
  - Platform: macOS
    Name:
    - No persistent launch agents/daemons detected (runs on-demand)
  SupportingComponents:
  - Platform: Windows
    Processes:
    - openvpn.exe
    - msedgewebview2.exe
    - tapinstall.exe
    Drivers:
    - wireguard.sys
    - tapprotonvpn.sys
    Attribution: >-
      Require the Proton VPN installation path, product-specific configuration,
      or direct Proton VPN process ancestry. OpenVPN, WebView2, TAP, and WireGuard
      components are shared or third-party dependencies and are not standalone
      Proton VPN identifiers.
  ApplicationInfo:
  - Platform: Windows
    AppName: Proton VPN
    ExecutableName: ProtonVPN.Client.exe
    Version: 4.4.1 (installer metadata 4.3.14-0cdcbc89; updated during installation)
    Publisher: Proton AG
    InstallLocation: C:\Program Files\Proton\VPN\
    InstallerType: Inno Setup bootstrapper with service-driven in-place update
    UninstallCommand: '"C:\Program Files\Proton\VPN\unins000.exe"'
    QuietUninstallCommand: '"C:\Program Files\Proton\VPN\unins000.exe" /SILENT'
    AdditionalComponents:
    - ProtonVPN Service manual-start LocalSystem service
    - ProtonVPNCallout manual-start kernel driver
    - Proton Drive 3.0.3 and Proton Mail 1.13.3 companion installations (retained
      after Proton VPN removal)
    - Proton Pass 1.38.1 MSIX download retained after Proton VPN removal (registration
      not confirmed)
  InstallationPaths:
  - Platform: Windows
    Path:
    - C:\Program Files\Proton\VPN\
    - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Proton\
    - '%LOCALAPPDATA%\Proton\Proton VPN\'
    - '%LOCALAPPDATA%\Proton\Proton VPN\WebView2\EBWebView\'
    - '%LOCALAPPDATA%\ToastNotificationManagerCompat\Apps\Proton.VPN\'
    - C:\Program Files\ProtonVPN\
    - '%LOCALAPPDATA%\ProtonVPN\'
    - '%APPDATA%\ProtonVPN\'
  - Platform: macOS
    Path:
    - /Applications/ProtonVPN.app
    - ~/Library/Containers/ch.protonvpn.mac/
    - ~/Library/Containers/ch.protonvpn.mac/Data/
    - ~/Library/Containers/ch.protonvpn.mac/Data/Library/Caches/ch.protonvpn.mac/
  ConfigFiles:
  - Platform: Windows
    Path:
    - '%LOCALAPPDATA%\ProtonVPN\*\user.config'
    - '%USERPROFILE%\AppData\Local\ProtonVPN'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\GlobalSettings.json'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\UnauthenticatedStatisticalEvents.bin'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\Announcements.<account-key>.bin'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\LocationNames.<account-key>.bin'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\Profiles.<account-key>.bin'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\Servers.<account-key>.bin'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\UserSettings.<account-key>.json'
    - '%LOCALAPPDATA%\Proton\Proton VPN\Storage\AuthenticatedStatisticalEvents.<account-key>.bin'
    - C:\Program Files\Proton\VPN\v*\ServiceData\ServiceSettings.json
    - C:\Program Files\Proton\VPN\v*\ServiceData\WireGuardServerRoutes.json
    - C:\Program Files\Proton\VPN\v*\ServiceData\WireGuard\ProtonVPN.conf
  - Platform: macOS
    Path:
    - ~/Library/Containers/ch.protonvpn.mac
    - ~/Library/Containers/ch.protonvpn.mac/Data/Library/Preferences/ch.protonvpn.mac.plist
    - ~/Library/Group Containers/J6S6Q257EK.group.ch.protonvpn.mac
  - Platform: Linux
    Path:
    - ~/.config/protonvpn/protonvpn.cfg
    - ~/.config/Proton/VPN
    - /etc/openvpn/*.ovpn
