Name: Proton Vpn
VendorInfo:
  Company: ProtonVPN AG
  Website: https://protonvpn.com/
  Jurisdiction: Switzerland
  BusinessModel: Freemium/Paid
ForensicAttributes:
  ProcessNames:
  - Platform: Windows
    Name:
    - ProtonVPN.Client.exe
    - ProtonVPN.Launcher.exe
    - ProtonVPN.WireGuardService.exe
    - ProtonVPN.RestoreInternet.exe
    - ProtonVPNService.exe
