Detection:
- Type: Forensic
  Description: >-
    Detect the normal interactive installation of Surfshark 6.8.0999 on Windows 11. The signed Advanced Installer
    bootstrapper installed its embedded MSI, registered a persistent service and per-user startup entry, installed
    OpenVPN DCO and SharkDivert drivers, and automatically launched the client to an untouched login GUI. The automatic
    launch also created user state and cached a signed updater payload; no authentication or VPN connection was
    attempted.
  Indicators:
  - >-
    Surfshark B.V.-signed C:\vpn-installers\surfshark.exe launched from Explorer and invoked the embedded
    SurfsharkSetup.msi through the Advanced Installer /i workflow
  - >-
    MSI product {F7661E64-4DF4-43BE-86F3-49581580142C} registered Surfshark 6.8.0999 under both the named and
    product-code uninstall keys and cached C:\Windows\Installer\390226a.msi
  - >-
    Installed C:\Program Files\Surfshark\Surfshark.exe and Surfshark.Service.exe were signed by Surfshark B.V.
  - >-
    Windows System event 7045 recorded the auto-start LocalSystem Surfshark Service, and Application event 48232 recorded
    it starting; its failure-recovery command invokes Surfshark.Vpn.Setup.exe with --restore-network-adapters and
    --start-vpn-service
  - >-
    The installer published OpenVPN Inc. ovpn-dco 2.5.6.0 as oem9.inf, created the disconnected OpenVPN Data Channel
    Offload for Surfshark adapter, and registered the running demand-start ovpn-dco kernel driver
  - >-
    The running demand-start SharkDivert kernel driver referenced
    C:\Program Files\Surfshark\Resources\x64\sharkdivert.sys; its Microsoft Windows Hardware Compatibility
    The publisher-signed binary was present in the installed driver package
  - >-
    HKCU\Software\Microsoft\Windows\CurrentVersion\Run\Surfshark launched C:\Program Files\Surfshark\Surfshark.exe, and
    the installer registered the Surfshark deep-link protocol plus public-desktop and Start Menu shortcuts
  - >-
    Persistent product state appeared under %PROGRAMDATA%\Surfshark\, %APPDATA%\Surfshark\, and
    %LOCALAPPDATA%\Surfshark\, including service and application logs, settings, location data, Sentry events, and the
    VPN service database
  - >-
    The automatic first launch left Surfshark.exe running at the login GUI and cached signed updater payload
    %LOCALAPPDATA%\Surfshark\Updates\stable64\6.8.0.999\5aqkhr0r.exe; its nominal version matched the installed build,
    so the update notification alone does not establish that the installer was outdated
  - >-
    Surfshark.WireGuardService.exe, wireguard.dll, and OpenVPN client payloads were staged but no WireGuard service or
    tunnel process was registered or started; no authentication, server selection, VPN connection, or reboot occurred
- Type: Network
  Description: >-
    The installer, persistent service, and automatically launched unauthenticated client generated certificate-status,
    application, update, and server-reachability traffic. The traffic is bounded installation and automatic-first-launch
    activity, not authentication or an established VPN tunnel; persistent network-state changes were limited to the new
    disconnected OpenVPN DCO adapter and its default local/link routes.
  Indicators:
  - >-
    The installer queried ocsp.globalsign.com and connected on TCP 80 for certificate-status checking; this domain is
    not treated as Surfshark infrastructure
  - >-
    Surfshark.Service.exe queried go-apps-s.s0r4nd0m.com and connected on TCP 443, alongside certificate-status lookups
    for ocsp.globalsign.com, ocsp.digicert.com, and secure.globalsign.com
  - >-
    Automatically launched Surfshark.exe queried go-apps-s.s0r4nd0m.com and communicated externally on TCP 80 and 443,
    while local TCP 34616 carried loopback communication with Surfshark.Service.exe
  - >-
    The client issued server-reachability probes to transient AWS-hosted addresses over UDP 1194 and 51820 and TCP 80,
    443, and 1443; capture-specific destination addresses and ephemeral source ports are not stable product indicators
  - >-
    oneocsp.microsoft.com, secure.globalsign.com, ocsp.digicert.com, and www.microsoft.com activity was
    certificate-status or connectivity-check traffic and is not treated as Surfshark infrastructure
  - >-
    No login submission, authenticated session, VPN helper execution, tunnel establishment, tunnel route, VPN DNS-server
    change, or firewall-rule change was observed
- Type: Network
  Description: >-
    A single synthetic invalid-login submission in the already-running Windows client produced a short HTTPS and local
    service-interprocess exchange before the GUI reported failure. This was an authentication failure path, not a
    successful login or VPN connection; no persistent adapter, route, DNS-server, firewall, service, driver, or startup
    change resulted.
  Indicators:
  - >-
    Surfshark.exe contacted a capture-specific Cloudflare address on TCP 443 immediately after submission; prior
    first-launch evidence associated the same Cloudflare address set with go-apps-s.s0r4nd0m.com, but the login capture
    contained no new product DNS query and the numeric address is not a stable product indicator
  - >-
    Surfshark.exe exchanged data with Surfshark.Service.exe over the existing loopback TCP 34616 channel; the service
    then contacted an external resolver and a capture-specific CDN address on TCP 443 during the same bounded failure sequence
  - >-
    Surfshark.exe wrote %APPDATA%\Surfshark\log.log and accessed existing %APPDATA%\Surfshark\settings.dat and data.dat;
    no new product file, process, service, driver, scheduled task, installed application, or startup entry appeared
  - >-
    Surfshark.exe and Surfshark.Service.exe remained running, while the OpenVPN DCO adapter, routes, DNS servers, and
    firewall rules were unchanged; no authenticated state or VPN tunnel was established
- Type: Network
  Description: >-
    A single manual connection attempt with explicitly synthetic service credentials, hostname, and TCP port reached
    the bundled OpenVPN execution path before the GUI reported VPN couldn't connect. The client did not authenticate or
    establish a tunnel, and no persistent adapter, route, DNS-server, firewall, service, driver, or startup change
    resulted.
  Indicators:
  - >-
    Surfshark.Service.exe created the ephemeral C:\Program Files\Surfshark\Configs\*.diff profile and launched
    OpenVPN 2.6.14 as LocalSystem with --management-hold, --management-query-passwords, --connect-retry-max 2,
    --register-dns, --dev-node "OpenVPN Data Channel Offload for Surfshark", and --service arguments; openvpn.exe was
    present in the bundled OpenVPN payload
  - >-
    The service controlled openvpn.exe over a capture-specific loopback management port, and openvpn.exe made two
    retry sequences to a capture-specific AWS Global Accelerator reverse-resolved destination on TCP 1443 before
    exiting approximately 44 seconds after launch; the destination resulted from the synthetic hostname and is not a
    stable Surfshark indicator
  - >-
    Surfshark.exe and Surfshark.Service.exe also made HTTPS connections to an external resolver and capture-specific
    Cloudflare and other numeric destinations around the attempt; because this capture contained no corresponding product
    DNS query or TLS name, those destinations are not promoted as stable Surfshark indicators
  - >-
    Surfshark.Service.exe created %PROGRAMDATA%\Surfshark\openVpnLog.log, updated serviceLog.log and
    vpnServiceData.db, then deleted the ephemeral *.diff profile after the failed attempt; Surfshark.exe updated
    %APPDATA%\Surfshark\data.dat, log.log, and settings.dat
  - >-
    After the failure, Surfshark.Service.exe ran netsh only to query the existing "Surfshark Block All IPv6" rule; the
    pre/post snapshots showed no adapter, route, DNS-server, firewall-rule, installed-application, service, driver,
    scheduled-task, or startup change, and no VPN tunnel was established
- Type: Forensic
  Description: >-
    A normal interactive uninstall of Surfshark 6.8.0999 removed the registered application, program payloads,
    Surfshark Service, SharkDivert, and the OpenVPN DCO adapter and driver package. The completion page selected restart
    by default; the operator disabled it so the capture preserved the pre-reboot residual state. A restart and
    product-specific cleanup remained necessary before reusing the host for another product.
  Indicators:
  - >-
    Explorer launched the registered command msiexec.exe /i {F7661E64-4DF4-43BE-86F3-49581580142C}
    AI_UNINSTALLER_CTP=1; the operator selected Next, Remove, disabled the default restart option, and clicked Finish
  - >-
    MSI descendants ran Surfshark.Vpn.Setup.exe with --uninstall-vpn-services, --uninstall-openvpn,
    --uninstall-firewall, --uninstall-bypasser, and --remove-app-folder; Surfshark.Setup.exe used
    --unregister-deep-link-protocol, and Surfshark.Antivirus.Uninstaller.exe ran with /epp
  - >-
    The state comparison recorded 2,041 removed files, including 2,007 under C:\Program Files\Surfshark\, the MSI cache
    C:\Windows\Installer\390226a.msi, OpenVPN DCO files under Program Files, System32\drivers, and DriverStore, and
    product data under ProgramData plus the user's Local and Roaming AppData directories
  - >-
    Both Surfshark uninstall registrations and Surfshark Service disappeared; SharkDivert and ovpn-dco were absent from
    the post-uninstall driver inventory, oem9.inf was absent from the post-uninstall PnP inventory, and the disconnected
    OpenVPN Data Channel Offload for Surfshark adapter plus its five local routes and two DNS rows were removed
  - >-
    tapctl.exe deleted the OpenVPN Data Channel Offload for Surfshark adapter, sc.exe deleted Surfshark Service and
    SharkDivert, and an MSI custom action invoked certutil.exe -delstore "Root" "Surfshark Root CA"
  - >-
    The pre-reboot snapshot retained the broken HKCU\Software\Microsoft\Windows\CurrentVersion\Run\Surfshark value
    targeting the removed Surfshark.exe, HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Application\Surfshark Service,
    and the pending HKLM\SYSTEM\CurrentControlSet\Services\ovpn-dco tree even though its device and files were gone
  - >-
    Residual files included NetFramework BreadcrumbStore entries named netcore,Surfshark*, installation logs
    antivirusSetup.log, appSetup.log, vpnSetup.log, and MSIDB2E.LOG, uninstall logs MSI67ad6.LOG and
    SurfsharkAntivirusUninstaller.log, plus C:\Windows\Temp\sharkdivert-2026-07-22.nwl
  - >-
    Previously observed Surfshark BAM and AppCompat execution-history values also remained cleanup targets; no Surfshark
    process, installed application, service, network adapter, or PnP driver package remained in the pre-reboot snapshot
- Type: Endpoint
  Description: Detect Surfshark VPN installation, execution, and network tunnel creation
  Indicators:
  - Process execution /Applications/Surfshark.app/Contents/MacOS/Surfshark
