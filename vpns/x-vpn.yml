    Path:
    - 'C:\Program Files\X-VPN\'
    - '%USERPROFILE%\X-VPN\'
    - '%WINDIR%\System32\drivers\tap0901.sys'
    - '%WINDIR%\System32\DriverStore\FileRepository\oemvista.inf_amd64_*\'
    - 'C:\Program Files\X-VPN\nettunnel\'
    - '%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\X-VPN.lnk'
    - '%PUBLIC%\Desktop\X-VPN.lnk'
    - '%WINDIR%\Prefetch\X-VPN.EXE-*.pf'
  ApplicationInfo:
  - Platform: Windows
    AppName: X-VPN
    Publisher: Free Connected Limited
    ExecutableName: X-VPN.exe
    Version: 77.5.2_5365_229f00fb
    InstallLocation: 'C:\Program Files\X-VPN'
    UninstallKey: HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\X-VPN
    UninstallCommand: '"C:\Program Files\X-VPN\Uninstall X-VPN.exe"'
    AdditionalComponents:
    - X-VPN_root.exe helper binary
    - X-VPN_notification.exe notification helper
    - WireGuardClient.exe, wireguard.dll, and wintun.dll
    - Chromium Embedded Framework runtime under lib1
    - OpenVPN 2.6.5 executable and tapctl utilities materialized under lib1 during first launch
    - TAP-Windows Adapter V9 driver package oem#.inf, version 9.26.0.0, and x-ovpn-tap adapter created during first launch
    - Connection-time nettunnel64.dll and Free Connected Limited-signed nettunnel64.sys kernel driver
  - Platform: macOS
    AppName: X-VPN.app
    BundleIdentifier: com.macroot.xvpn
    ExecutableName: X-VPN
    Version: 1.0
    BuildVersion: 1
    InstallLocation: /Applications/X-VPN.app
    SystemExtensions:
    - Name: com.macroot.xvpn.transparentProxy.systemextension
      BundleIdentifier: com.macroot.xvpn.transparentProxy
      Version: 77.5.2
      BuildVersion: 5434
      Type: NetworkExtension (Transparent Proxy)
      Description: App-proxy network extension for transparent proxying
    AdditionalComponents:
    - X-VPN_root (privileged helper)
    - com.macroot.xvpn.transparentProxy (system extension)
  ConfigFiles:
