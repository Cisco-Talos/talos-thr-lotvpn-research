  - HKCU\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store\C:\Program Files\X-VPN\Uninstall X-VPN.exe
  - HKCU\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache\*\x-vpn.exe.FriendlyAppName
  - HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations
  - HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\*\Device\HarddiskVolume*\Users\*\AppData\Local\Temp\~nsu*.tmp\Un.exe
  LogFiles:
