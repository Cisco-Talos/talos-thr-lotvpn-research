  - HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run\X-VPN
  - HKLM\SYSTEM\CurrentControlSet\Services\tap0901
  - HKLM\SYSTEM\CurrentControlSet\Services\nettunnel
  - HKLM\SYSTEM\CurrentControlSet\Services\EventLog\System\nettunnel
  - HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\*\NameServer
  - HKCR\X-VPN
  - HKCU\Software\Classes\x-vpn-client
  - HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\*\Device\HarddiskVolume*\*\x-vpn.exe
  - HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\*\Device\HarddiskVolume*\Program Files\X-VPN\X-VPN.exe
