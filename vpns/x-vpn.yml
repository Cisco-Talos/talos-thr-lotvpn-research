Name: X-Vpn
ForensicAttributes:
  ProcessNames:
  - Platform: Windows
    Name:
    - xvpn.exe
    - X-VPN.exe
    - X-VPN_root.exe
    - X-VPN_notification.exe
  - Platform: macOS
    Name:
    - X-VPN
    - X-VPN_root
    - com.macroot.xvpn.transparentProxy
  SupportingComponents:
  - Platform: Windows
    Processes:
    - X-VPN - Best VPN Proxy master Installer (1).exe
    - X-VPN - Best VPN Proxy master Installer.exe
    - WireGuardClient.exe
    - openvpn-windows-x86.exe
    - tapctl64.exe
    - Uninstall X-VPN.exe
    - Un.exe
    - uninstall.exe
    Drivers:
    - tap0901
    Attribution: >-
      Require an X-VPN path, Free Connected Limited signature, product-specific
      argument, service or driver registration, or direct X-VPN process ancestry;
      these are installer, bundled tunnel, TAP, and uninstaller components.
  ServiceNames:
  - Platform: Windows
    Name:
    - nettunnel
  InstallationPaths:
