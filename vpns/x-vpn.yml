    Path:
    - '%LOCALAPPDATA%\Temp\x-vpn.log'
    - '%USERPROFILE%\X-VPN\log.log'
  CodeSigning:
  - Platform: Windows
    Publisher: Free Connected Limited
    Status: Valid installer, SensorMonitor.dll, uninstall.exe, WireGuardClient.exe, X-VPN.exe, X-VPN_notification.exe, X-VPN_root.exe, and connection-time nettunnel64.sys signatures
  - Platform: Windows
    Publisher: WireGuard LLC
    Status: Valid bundled wintun.dll and wireguard.dll signatures
  - Platform: Windows
    Publisher: Microsoft Windows Hardware Compatibility Publisher
    Status: Valid TAP-Windows tap0901.sys and tap0901.cat signatures
  - Platform: Windows
    Publisher: Not signed
    Status: The registered Uninstall X-VPN.exe bootstrap, first-launch OpenVPN and tapctl executables, connection-time nettunnel64.dll, and several bundled CEF or graphics libraries were unsigned
  CommandLineArgs:
  - Platform: Windows
    Args:
